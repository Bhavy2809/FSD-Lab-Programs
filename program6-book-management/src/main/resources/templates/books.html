<!DOCTYPE html>
<!-- Program 6: Book list page, served at http://localhost:8080/books (run: mvn spring-boot:run) -->
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>

<body>

    <h2>Book List</h2>

    <a th:href="@{/books/add}">Add New Book</a>

    <br><br>

    <table border="1" cellpadding="6">

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Action</th>
        </tr>

        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td>
                <a th:href="@{/books/delete/{id}(id=${book.id})}">
                    Delete
                </a>
            </td>
        </tr>

    </table>

</body>
</html>
